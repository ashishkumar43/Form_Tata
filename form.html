<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tata PreEnrollment Form</title>
</head>
<body bgcolor="LightPink">
    <table width="100%">
        <tr>
            <td align="right"><h1>Pre Enrollment Form</h1></td>
            <td style="text-align: end;"><img src="image1.png" alt="Loading"></td>
        </tr>
    </table>
    <Form>
        <table align="center">
        <tr>   
            <td><label><b>Candidate's Name:</b></label></td>
            <td><input type="text" placeholder="First Name">
                <input type="text" placeholder="Middle Name">
                <input type="text" placeholder="Last Name">
            </td>
            <!-- <td><input type="text" placeholder="Enter Name"><br></td> -->
        </tr>
        <tr>
            <td><label for="Id"><b>Application Id:</b></label></td>
            <td><input type="text"id="Application Id" size="72" placeholder="Emp1223"><br></td>
        </tr>
        <tr>
            <td><label for="Name"><b>Father's Name:</b></label></td>
            <td><input type="text" placeholder="First Name">
                <input type="text" placeholder="Middle Name">
                <input type="text"  placeholder="Last Name">
            </td>
        </tr>
        <tr>
            <td><label for="Date"><b>Parent's Phone:</b></label></td>
            <td><input type="text" size="1" value="91+"> <input type="text" placeholder="Phone Number" size="39"><br></td>
        </tr>
        <tr>
            <td><label for="Date"><b>Candidate's Phone:</b></label></td>
            <td><input type="text" size="1" value="91+"> <input type="text" placeholder="Phone Number" size="39"><br></td>
        </tr>
        <tr>
            <td><label for="Email"><b>Email Id:</b></label></td>
            <td><input type="Email" placeholder="example@gmail.com"size="46"><br></td>
        </tr>
        <tr>
            <td><label for="Gender"><b>Gender:</b></label></td>
            <td>
                <input type="radio" name="g">Male
                <input type="radio" name="g">Female
            </td>
        </tr>
        <tr>
            <td><label for="department"><b>Department:</b></label></td>
            <td>
                <input type="checkbox">CSAI
                <input type="checkbox">CSE
                <input type="checkbox">IT
                <input type="checkbox">ECE
                <input type="checkbox">MECH
                <input type="checkbox">CIVIL
            </td>
        </tr>
        <tr>
            <td><b>Course:</b></td>
            <td>
                <select>
                    <option><b>Select Course:</b></option>
                    <option><b>FSJD</b></option>
                    <option><b>AWS</b></option>
                </select>
            </td>
        </tr>
        <tr>
            <td><label for="image"><b>Candidate Photo:</b></label></td>
            <td><input type="File"><br></td>
        </tr>
        <tr>
            <td><label for="City"><b>City:</b></label></td>
            <td><input type="text" placeholder="Example Delhi" size="46"><br></td>
        </tr>
        <tr>
            <td><label for="Final Course"><b>Final Course:</b></label></td>
            <td><input type="text" placeholder="FSJD/AWS" size="46"><br></td>
        </tr>
        <tr>
            <td><label for="Date of 1st Counselling"><b>Date of 1st Counselling:</b></label></td>
            <td><input type="text" placeholder="Example 23/4/2000" size="46"><br></td>
        </tr>
        <tr>
            <td><label for="Full Address"><b>Full Address:</b></label></td>
            <td><input type="text" placeholder="Example Bihar" size="46"><br></td>
        </tr>
        <tr>
            <td><label for="Date"><b>Date:</b></label></td>
            <td><input type="Date" placeholder="Date"> <b>DD-MM-YYYY</b><br></td>
        </tr>
        <tr>
            <center><td><button type="submit"><b>Submit</b></button></td></center>
        </tr>
        </table>
    </Form>
        <table width="100%" height="100%">
            <tr>
                <td align="right">
                <h2>Made By Ashish Kumar</h2>
                </td>
            </tr>
        </table>
</body>
</html>
